<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3c72">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="mode-label" id="modeLabel">Waktu Fokus</div>
    <div class="timer" id="timerDisplay">25:00</div>
    <div class="subtitle" id="statusText">Siap untuk fokus!</div>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="mode-switch">
      <button id="btnFocus" class="active" onclick="setMode('focus')">Fokus</button>
      <button id="btnBreak" onclick="setMode('break')">Istirahat</button>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Mulai</button>
      <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
    </div>

    <div class="settings">
      <label>Fokus <input type="number" id="focusInput" value="25" min="1" max="120"></label>
      <label>Istirahat <input type="number" id="breakInput" value="5" min="1" max="60"></label>
    </div>

    <button class="notif-btn" id="notifBtn" onclick="requestNotifPermission()">
      🔔 Aktifkan Notifikasi Desktop
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
